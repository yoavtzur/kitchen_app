<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michelin Cockpit — OLED Dark</title>
<style>
  /* ============================================================================
     DESIGN TOKENS — "Michelin Cockpit / OLED Dark"
     Ultra-high-contrast command-center aesthetic: near-black obsidian surfaces,
     laser-bright luminous accents, monospaced tabular numerals for anything
     that counts down or measures. Every token is commented with its purpose so
     a human can later decide which (if any) belong in src/styles/tokens.css.
     NONE of this has been migrated there — this file is a standalone design
     exploration only.
     ============================================================================ */
  :root {
    /* --- Surfaces: near-black obsidian, no warmth --- */
    --bg: #090A0F;             /* page/app background */
    --surface: #12141C;        /* card background */
    --surface-2: #181B26;      /* raised/secondary surface (header, nav, sheet) */
    --surface-3: #1F2330;      /* hover/pressed surface */
    --border: #242838;         /* hairline border */
    --border-strong: #323851;

    /* --- Text --- */
    --text: #E7EAF3;
    --text-muted: #8891A8;
    --text-faint: #565D75;

    /* --- Laser-bright accent palette, per the brief --- */
    --accent-green: #00FF87;   /* on track */
    --accent-amber: #FFAA00;   /* prep delay warning */
    --accent-red: #FF3B30;     /* critical service timing */
    --accent-blue: #3BB6FF;    /* informational / in-progress (not in the brief's
                                   3-color list, but needed for a 4th status —
                                   kept in the same "laser" family) */
    --focus-ring: #00FF87;

    /* --- Priority triad (maps 1:1 to real app's red/yellow/green semantics) --- */
    --priority-red: var(--accent-red);
    --priority-yellow: var(--accent-amber);
    --priority-green: #3A4048; /* muted, not bright — see StationDispatch's
                                   identical reasoning: green is reserved to
                                   unambiguously mean "done" */

    /* --- Radii: soft enough to feel like glass/HUD panels, not sharp tool edges --- */
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 24px;
    --radius-pill: 999px;

    /* --- Spacing scale --- */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    /* --- Type: geometric sans for labels, tabular-nums monospace for every
       timer/countdown/measurement per the brief --- */
    --font-family: 'Avenir Next', -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SFMono-Regular', ui-monospace, Consolas, 'Roboto Mono', monospace;

    --nav-height: 72px; /* taller: the floating HUD nav needs room to detach from the edge */
    --shadow-sheet: 0 -8px 40px rgba(0,0,0,.6);
    --toast-shadow: 0 4px 24px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    font-family: var(--font-family);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  /* ---- Presentation chrome only: centers the phone-shaped card for desktop
     browser review. Not part of the "app" itself. ---- */
  .frame-label {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: #444; font-family: var(--font-mono);
  }

  .phone-frame {
    width: 100%; max-width: 420px; min-height: 840px;
    background: var(--bg);
    border-radius: 32px;
    border: 1px solid #1a1c26;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(0,255,135,.04);
  }

  /* Subtle HUD scanline texture — very low-opacity, slowly drifting repeating
     gradient over the whole screen, reinforcing "you're looking at a display"
     without ever competing with real content for attention. */
  .phone-frame::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,135,.025) 0px,
      rgba(0,255,135,.025) 1px,
      transparent 1px,
      transparent 3px
    );
    background-size: 100% 6px;
    animation: scanline-drift 9s linear infinite;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: screen;
  }
  @keyframes scanline-drift { from { background-position: 0 0; } to { background-position: 0 600px; } }

  /* ============================== HEADER ============================== */
  .app-header {
    background: linear-gradient(180deg, var(--surface-2), var(--bg));
    border-bottom: 1px solid var(--border);
    padding: var(--space-4) var(--space-4) var(--space-3);
  }
  .header-title { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

  /* ============================== FEED ============================== */
  .task-feed { flex: 1; overflow-y: auto; padding: var(--space-4); padding-bottom: calc(var(--nav-height) + var(--space-6)); }

  /* ---- Station group header ---- */
  .station-section { margin-bottom: var(--space-5); }
  .station-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    padding: var(--space-3);
    margin-bottom: var(--space-2);
  }
  .station-name { font-size: 13px; font-weight: 700; }
  .station-row { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-2); }
  .cook-avatars { display: flex; gap: 6px; }
  .cook-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #06121F;
    border: 2px solid var(--surface);
  }
  .progress-track { flex: 1; height: 6px; background: var(--surface-3); border-radius: var(--radius-pill); margin-inline-start: var(--space-3); overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: inherit; transition: width .3s ease;
    background: linear-gradient(90deg, var(--accent-green) 0%, #6fffc0 50%, var(--accent-green) 100%);
    background-size: 200% 100%;
    box-shadow: 0 0 8px rgba(0,255,135,.7);
    animation: progress-shimmer 2.4s linear infinite;
  }
  @keyframes progress-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .progress-label { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-muted); margin-inline-start: var(--space-2); white-space: nowrap; }

  /* ============================== TASK CARD ============================== */
  .task-card { margin-bottom: var(--space-3); }

  /* Priority border mirrors the real app's .priority-card convention (3px
     colored border) but adds a glow shadow to fit the "command center
     telemetry" aesthetic — light doesn't just mark state here, it radiates. */
  .swipe-wrap {
    position: relative; overflow: hidden;
    border-radius: var(--radius-m);
    border: 2px solid transparent;
    background: var(--surface);
  }
  .task-card.priority-red .swipe-wrap { border-color: var(--priority-red); box-shadow: 0 0 20px -6px rgba(255,59,48,.7); }
  .task-card.priority-yellow .swipe-wrap { border-color: var(--priority-yellow); box-shadow: 0 0 16px -6px rgba(255,170,0,.5); }
  .task-card.priority-green .swipe-wrap { border-color: var(--priority-green); }
  .task-card.done .swipe-wrap { border-color: var(--accent-green); box-shadow: 0 0 20px -6px rgba(0,255,135,.6); background: rgba(0,255,135,.04); }

  .swipe-action {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(0,255,135,.25), rgba(0,255,135,.08));
    color: var(--accent-green);
    font-weight: 800; font-size: 15px; letter-spacing: .04em;
    text-shadow: 0 0 12px rgba(0,255,135,.8);
  }

  .swipe-surface { position: relative; touch-action: pan-y; user-select: none; min-height: 48px; background: var(--surface); }

  .task-card-inner { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-3); }
  .task-main { flex: 1; min-width: 0; }

  /* Tap-ripple micro-interaction: a small radial glow burst at the exact tap
     point on status-cycle, reinforcing "you just told the telemetry system
     something" beyond the existing .tappable scale-down. Pure CSS animation
     on a JS-inserted, self-removing element (see spawnRipple() in <script>). */
  .tap-ripple {
    position: absolute;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,135,.55), transparent 70%);
    pointer-events: none;
    z-index: 5;
    animation: ripple-burst .5s ease-out forwards;
  }
  @keyframes ripple-burst {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(14); opacity: 0; }
  }

  /* Radar-style pulsing-ring status dot — colored by the task's own priority
     (matching the real app's PriorityDot), with the red variant pulsing to
     draw the eye, same as the real .priority-dot's dot-ping keyframe. Done
     always overrides to a steady green glow regardless of priority. */
  .status-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; position: relative; }
  .status-dot.priority-red { background: var(--accent-red); animation: radar-ping 1.6s ease-out infinite; --ring-color: 255,59,48; }
  .status-dot.priority-yellow { background: var(--accent-amber); }
  .status-dot.priority-green { background: var(--text-faint); }
  .status-dot.done { background: var(--accent-green); box-shadow: 0 0 8px rgba(0,255,135,.9); animation: none; }

  @keyframes radar-ping {
    0% { box-shadow: 0 0 0 0 rgba(var(--ring-color), .6); }
    70% { box-shadow: 0 0 0 10px rgba(var(--ring-color), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--ring-color), 0); }
  }

  .task-title { font-size: 14px; font-weight: 700; line-height: 1.35; }
  .task-card.done .task-title { text-decoration: line-through; opacity: .45; }

  .task-dependency { display: none; } /* Atelier-signature detail; not shown in this direction */

  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-2); margin-top: 8px; font-size: 11px; color: var(--text-muted); }

  .priority-pill {
    display: inline-flex; align-items: center; border-radius: var(--radius-pill);
    padding: 2px 8px; font-size: 10px; font-weight: 800; letter-spacing: .04em;
  }
  .priority-pill.pill-red { background: rgba(255,59,48,.15); color: var(--accent-red); }
  .priority-pill.pill-yellow { background: rgba(255,170,0,.15); color: var(--accent-amber); }
  .priority-pill.pill-green { background: rgba(255,255,255,.06); color: var(--text-faint); }

  .assignee-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px 2px 2px; border-radius: var(--radius-pill);
    background: var(--surface-3); border: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted);
  }
  .assignee-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--cook-color, #888); }

  .info-btn {
    width: 40px; height: 40px; min-width: 40px; border-radius: 50%;
    background: var(--surface-3); border: 1px solid var(--border);
    color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .info-btn:hover { color: var(--accent-green); border-color: rgba(0,255,135,.4); }

  /* ============================== BOTTOM NAV — floating HUD ============================== */
  /* Signature detail #2: a frosted-glass floating HUD, detached from the
     screen edge, per the brief's "floating HUD bottom navigation bar with
     blur backdrop" requirement. */
  .bottom-nav {
    position: fixed;
    left: var(--space-3); right: var(--space-3); bottom: var(--space-3);
    max-width: calc(420px - var(--space-3) * 2);
    margin: 0 auto;
    display: flex;
    background: rgba(18,20,28,.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--radius-l);
    height: 60px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-faint); font-size: 10px; }
  .nav-item.active { color: var(--accent-green); text-shadow: 0 0 8px rgba(0,255,135,.6); }
  .nav-icon { font-size: 16px; }

  /* ============================== BOTTOM SHEET ============================== */
  /* NOTE: the real app's BottomSheet.tsx has NO transition at all — it mounts
     instantly via React conditional render. The animated spring slide-up below
     is a deliberate, net-new ergonomic improvement proposed by this prototype,
     not a port of existing behavior. */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; pointer-events: none;
    transition: background .25s ease;
  }
  .overlay.open { background: rgba(0,0,0,.7); pointer-events: auto; }

  .sheet {
    width: 100%; max-width: 420px;
    background: var(--surface-2);
    border-top: 1px solid rgba(0,255,135,.15);
    border-radius: var(--radius-l) var(--radius-l) 0 0;
    max-height: 82vh; overflow-y: auto;
    padding: var(--space-5) var(--space-4) var(--space-6);
    box-shadow: var(--shadow-sheet);
    transform: translateY(100%);
    transition: transform .38s cubic-bezier(.34, 1.56, .64, 1);
  }
  .overlay.open .sheet { transform: translateY(0); }

  .sheet-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-4); }
  .sheet-title { font-size: 16px; font-weight: 800; }
  .sheet-close {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface-3); border: 1px solid var(--border); color: var(--text);
    font-size: 16px; cursor: pointer;
  }

  .sheet-meta-row { display: flex; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sheet-meta-row .meta-label { color: var(--text-muted); }
  .sheet-meta-row .meta-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: end; }

  .sheet-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); margin: var(--space-4) 0 var(--space-2); }

  .checklist-item { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; font-size: 13px; }
  .checklist-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent-green); }
  .checklist-qty { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-muted); margin-inline-start: auto; }

  .step-list { margin: 0; padding-inline-start: 20px; font-size: 13px; line-height: 1.7; color: var(--text); }
  .step-list li { margin-bottom: 4px; }

  /* ============================== TOASTS ============================== */
  #toast-root {
    position: fixed; left: 50%; bottom: calc(var(--nav-height) + 20px);
    transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px;
    z-index: 200; pointer-events: none;
    width: calc(100% - 32px); max-width: 380px; align-items: center;
  }
  .toast {
    pointer-events: auto;
    display: flex; align-items: center; gap: 6px;
    padding: 10px 18px; border-radius: var(--radius-pill);
    font-size: 12.5px; font-weight: 700;
    box-shadow: var(--toast-shadow);
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    opacity: 0; transform: translateY(8px) scale(.92);
    animation: toast-in .28s cubic-bezier(.34,1.56,.64,1) forwards, toast-out .22s ease 2.6s forwards;
    max-width: 100%;
  }
  .toast-icon { font-size: 13px; line-height: 1; }
  .toast.tone-success { border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 20px -4px rgba(0,255,135,.5); }
  .toast.tone-info { border-color: var(--accent-amber); color: var(--accent-amber); box-shadow: 0 0 20px -4px rgba(255,170,0,.5); }
  .toast.tone-alert { border-color: var(--accent-red); color: var(--accent-red); box-shadow: 0 0 20px -4px rgba(255,59,48,.5); }
  @keyframes toast-in { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

  /* ============================== COOK COMPLETION SUMMARY ============================== */
  /* A per-cook "how many tasks has each cook finished" leaderboard, pinned at
     the bottom of the Home feed below every station group — a shift-wide
     telemetry readout rather than a per-station number. */
  .cook-summary {
    margin-top: var(--space-2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    padding: var(--space-3) var(--space-4);
  }
  .cook-summary-title {
    font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: var(--space-3);
  }
  .cook-summary-row {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--border);
  }
  .cook-summary-row:last-child { border-bottom: none; }
  .cook-summary-name { flex: 1; font-size: 13px; font-weight: 600; }
  .cook-summary-bar-track {
    flex: 1.4; height: 6px; background: var(--surface-3);
    border-radius: var(--radius-pill); overflow: hidden;
  }
  .cook-summary-bar-fill {
    height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, var(--accent-green) 0%, #6fffc0 50%, var(--accent-green) 100%);
    background-size: 200% 100%;
    box-shadow: 0 0 6px rgba(0,255,135,.6);
    animation: progress-shimmer 2.4s linear infinite;
    transition: width .3s ease;
  }
  .cook-summary-count {
    min-width: 28px; text-align: end;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 800;
    color: var(--accent-green); text-shadow: 0 0 6px rgba(0,255,135,.6);
  }

  /* ============================== SHARED TACTILE / A11Y UTILITY ============================== */
  .tappable { transition: transform .1s ease; }
  .tappable:active { transform: scale(0.96); }
  .tappable:focus-visible,
  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  .empty-note { text-align: center; color: var(--text-faint); font-size: 12px; padding: var(--space-4); }
</style>
</head>
<body>
  <div class="frame-label">MICHELIN COCKPIT · OLED DARK</div>

  <div class="phone-frame">
    <header class="app-header">
      <div class="header-title">מטבח האומן — משמרת ערב</div>
      <div class="header-sub">יום שלישי · 12/09 · 5 משימות פעילות</div>
    </header>

    <main class="task-feed" id="task-feed"></main>

    <nav class="bottom-nav" aria-hidden="true">
      <div class="nav-item active"><span class="nav-icon">🏠</span>בית</div>
      <div class="nav-item"><span class="nav-icon">✓</span>משימות</div>
      <div class="nav-item"><span class="nav-icon">🧺</span>מצרכים</div>
      <div class="nav-item"><span class="nav-icon">📖</span>מתכונים</div>
      <div class="nav-item"><span class="nav-icon">⋯</span>עוד</div>
    </nav>
  </div>

  <div id="sheet-root">
    <div class="overlay" id="overlay">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-header">
          <h2 class="sheet-title" id="sheet-title">—</h2>
          <button type="button" class="sheet-close tappable" id="sheet-close-btn" aria-label="סגור">✕</button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>

  <div id="toast-root" aria-live="polite"></div>

<script>
/* ==========================================================================
   SHARED ENGINE — near-identical across all three Direction-*.html files, so
   the three prototypes are a fair like-for-like comparison of VISUAL
   direction only. This file omits the StationDispatch-exclusive brigade
   reassignment popover (cook avatars here are decorative, non-interactive) —
   see Direction-StationDispatch.html for that affordance.
   ========================================================================== */

// ---- Mock data -----------------------------------------------------------
const CATEGORY_LABELS = { cold: 'פס קר', hot: 'פס חם', taboon: 'טאבון', dessert: 'קינוחים', general: 'כללי' };

// ILLUSTRATIVE ONLY. The real app has no brigade-station concept — its only
// station-like field is the 5-value RecipeCategory above. These station names
// exist purely to demonstrate the "Full Brigade" design concept; a real
// implementation would need to extend RecipeCategory or add a separate
// station-assignment field to support this view for real.
const BRIGADE_STATIONS = {
  garde_manger: { label: 'Garde-Manger · פס קר' },
  saucier: { label: 'Saucier · פס חם' },
  patissier: { label: 'Pâtissier · קינוחים' },
};

const PRIORITY_LABELS = { red: 'דחוף', yellow: 'לא דחוף', green: 'לא צריך' };

const COOKS = [
  { id: 'c1', name: 'דניאל', color: '#e8446a' },
  { id: 'c2', name: 'נועה', color: '#1c8a6c' },
  { id: 'c3', name: 'עומר', color: '#c99a2e' },
];

// Status model deliberately kept binary — `done: boolean` — matching the
// real app's actual DisplayTask shape (src/lib/tasks.ts) exactly, rather than
// the richer pending/in-progress/paused cycle this direction started with.
const MOCK_TASKS = [
  {
    id: 't1', title: 'התחלת ייבוש יבש — אנטריקוט 21 יום', category: 'cold', station: 'garde_manger',
    timeWindow: 'preService', priority: 'yellow', assigneeId: 'c1', done: false,
    targetTemp: '1–3°C · לחות 82%',
    dependency: 'יש לתעד תאריך התחלה על התווית לפני העברה לתא הייבוש',
    ingredients: [{ name: 'אנטריקוט שלם', qty: '4', unit: 'ק"ג' }, { name: 'מלח גס', qty: '0.2', unit: 'ק"ג' }],

  },

// ---- State -----------------------------------------------------------
const state = {
  tasks: MOCK_TASKS.map((t) => ({ ...t })),
  activeSheetTaskId: null,
  toastSeq: 0,
};

function cookById(id) { return COOKS.find((c) => c.id === id); }
function taskById(id) { return state.tasks.find((t) => t.id === id); }

// Swipe always toggles done — matching the real SwipeToComplete.tsx, whose
// label already reads "✓ בוצע" / "↩ בטל בוצע" depending on current state.
function toggleTaskDone(taskId) {
  const task = taskById(taskId);
  if (!task) return;
  task.done = !task.done;
  pushToast(task.done ? `הושלם: ${task.title}` : `בוטל: ${task.title}`, task.done ? 'success' : 'info');
  render();
}

// ---- Toasts -----------------------------------------------------------
const TOAST_ICONS = { success: '✓', info: 'ℹ', alert: '⚠' };
function pushToast(message, tone) {
  tone = tone || 'success';
  const id = 'toast-' + (++state.toastSeq);
  const el = document.createElement('div');
  el.className = `toast tone-${tone}`;
  el.id = id;
  el.innerHTML = `<span class="toast-icon">${TOAST_ICONS[tone] || ''}</span><span>${message}</span>`;
  el.addEventListener('click', () => el.remove());
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => { const n = document.getElementById(id); if (n) n.remove(); }, 3000);
}

/* ==========================================================================
   MICHELIN-COCKPIT-EXCLUSIVE: tap-ripple micro-interaction. A polish detail
   specific to this direction — the other two Direction files don't include
   this block.
   ========================================================================== */

// A short-lived glow burst at the tap point, purely visual. Anchored to the
// persistent .phone-frame (not the task card itself) because
// toggleTaskDone()/render() replaces #task-feed's innerHTML synchronously
// right after this fires — a ripple appended inside the card would be
// destroyed before its animation ever played.
function spawnRipple(clientX, clientY) {
  const frame = document.querySelector('.phone-frame');
  const rect = frame.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'tap-ripple';
  ripple.style.left = (clientX - rect.left) + 'px';
  ripple.style.top = (clientY - rect.top) + 'px';
  frame.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

// ---- Bottom sheet -----------------------------------------------------------
function openSheet(taskId) {
  const task = taskById(taskId);
  if (!task) return;
  state.activeSheetTaskId = taskId;
  const cook = cookById(task.assigneeId);

  document.getElementById('sheet-title').textContent = task.title;
  document.getElementById('sheet-body').innerHTML = `
    <div class="sheet-meta-row"><span class="meta-label">תחנה</span><span class="meta-value">${CATEGORY_LABELS[task.category]}</span></div>
    <div class="sheet-meta-row"><span class="meta-label">טמפרטורת יעד</span><span class="meta-value">${task.targetTemp}</span></div>
    <div class="sheet-meta-row"><span class="meta-label">אחראי</span><span class="meta-value">${cook ? cook.name : '—'}</span></div>
    <div class="sheet-meta-row"><span class="meta-label">סטטוס</span><span class="meta-value">${task.done ? 'הושלם' : 'פתוח'}</span></div>

    <div class="sheet-section-title">רשימת מצרכים</div>
    ${task.ingredients.map((ing, i) => `
      <label class="checklist-item">
        <input type="checkbox" id="chk-${task.id}-${i}">
        <span>${ing.name}</span>
        <span class="checklist-qty">${ing.qty} ${ing.unit}</span>
      </label>
    `).join('')}

    <div class="sheet-section-title">אופן הכנה</div>
    <ol class="step-list">${task.steps.map((s) => `<li>${s}</li>`).join('')}</ol>
  `;

  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('open')));
}

function closeSheet() {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 400);
  state.activeSheetTaskId = null;
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeSheet();
});
document.getElementById('sheet-close-btn').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.activeSheetTaskId !== null) closeSheet();
});

// ---- Swipe-to-complete (Pointer Events: unifies mouse + touch in one path —
// a deliberate widening of the real app's touch-only SwipeToComplete.tsx).
// Ports the exact dead-zone/threshold constants from src/lib/swipe.ts. ------
function attachSwipeHandlers(surfaceEl, onCommit) {
  const DEAD_ZONE = 8;
  const COMPLETE_FRACTION = 0.4;
  const COMPLETE_MIN_PX = 96;
  let startX = 0, startY = 0, dx = 0, axis = 'undecided', dragging = false, lastX = 0, lastY = 0;

  surfaceEl.style.touchAction = 'pan-y';

  surfaceEl.addEventListener('pointerdown', (e) => {
    dragging = true;
    startX = e.clientX; startY = e.clientY; dx = 0; axis = 'undecided';
    surfaceEl.setPointerCapture(e.pointerId);
    surfaceEl.style.transition = 'none';
  });

  surfaceEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    lastX = e.clientX; lastY = e.clientY;
    const ddx = e.clientX - startX;
    const ddy = e.clientY - startY;
    if (axis === 'undecided') {
      if (Math.abs(ddx) < DEAD_ZONE && Math.abs(ddy) < DEAD_ZONE) return;
      axis = Math.abs(ddx) > Math.abs(ddy) ? 'horizontal' : 'vertical';
    }
    if (axis !== 'horizontal') return;
    dx = ddx;
    surfaceEl.style.transform = `translateX(${dx}px)`;
  });

  function release() {
    if (!dragging) return;
    dragging = false;
    const width = surfaceEl.offsetWidth || 1;
    const threshold = Math.max(width * COMPLETE_FRACTION, COMPLETE_MIN_PX);
    surfaceEl.style.transition = 'transform .2s ease';
    if (axis === 'horizontal' && Math.abs(dx) >= threshold) {
      surfaceEl.style.transform = `translateX(${dx < 0 ? -width : width}px)`;
      onCommit(lastX, lastY);
      setTimeout(() => { surfaceEl.style.transition = 'none'; surfaceEl.style.transform = ''; }, 210);
    } else {
      surfaceEl.style.transform = 'translateX(0)';
    }
    axis = 'undecided'; dx = 0;
  }

  surfaceEl.addEventListener('pointerup', release);
  surfaceEl.addEventListener('pointercancel', release);
}

// ---- Rendering -----------------------------------------------------------
function renderTaskCard(task) {
  const cook = cookById(task.assigneeId);
  return `
    <div class="task-card priority-${task.priority}${task.done ? ' done' : ''}" data-id="${task.id}">
      <div class="swipe-wrap">
        <div class="swipe-action">${task.done ? '↩ בטל בוצע' : '✓ בוצע'}</div>
        <div class="swipe-surface tappable" data-swipe-id="${task.id}">
          <div class="task-card-inner">
            <span class="status-dot priority-${task.priority}${task.done ? ' done' : ''}"></span>
            <div class="task-main">
              <div class="task-title">${task.title}</div>
              <div class="task-dependency">${task.dependency || ''}</div>
              <div class="task-meta">
                <span class="priority-pill pill-${task.priority}">${PRIORITY_LABELS[task.priority]}</span>
                ${cook ? `<span class="assignee-pill"><span class="assignee-dot" style="--cook-color:${cook.color}"></span>${cook.name}</span>` : ''}
              </div>
            </div>
            <button type="button" class="info-btn tappable" data-info-id="${task.id}" aria-label="פרטי משימה">›</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderFullBrigade() {
  let html = '';
  Object.keys(BRIGADE_STATIONS).forEach((stationKey) => {
    const tasks = state.tasks.filter((t) => t.station === stationKey);
    if (tasks.length === 0) return;
    const station = BRIGADE_STATIONS[stationKey];
    const assignedCookIds = [...new Set(tasks.map((t) => t.assigneeId))];
    const doneCount = tasks.filter((t) => t.done).length;
    const pct = Math.round((doneCount / tasks.length) * 100);
    html += `
      <div class="station-section">
        <div class="station-header">
          <div class="station-name">${station.label}</div>
          <div class="station-row">
            <div class="cook-avatars">
              ${assignedCookIds.map((id) => {
                const c = cookById(id);
                return `<span class="cook-avatar" style="background:${c.color}" title="${c.name}">${c.name[0]}</span>`;
              }).join('')}
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label">${doneCount}/${tasks.length}</div>
          </div>
        </div>
        ${tasks.map(renderTaskCard).join('')}
      </div>
    `;
  });
  return html;
}

// Shift-wide "how many tasks has each cook finished" readout, sorted by
// count descending so the shift's top performer reads first — pinned below
// every station group, distinct from each station's own done/total meter.
function renderCookSummary() {
  const counts = COOKS.map((c) => ({
    cook: c,
    count: state.tasks.filter((t) => t.assigneeId === c.id && t.done).length,
  })).sort((a, b) => b.count - a.count);
  const maxCount = Math.max(1, ...counts.map((c) => c.count));

  return `
    <div class="cook-summary">
      <div class="cook-summary-title">משימות שהושלמו לפי טבח</div>
      ${counts.map(({ cook, count }) => `
        <div class="cook-summary-row">
          <span class="assignee-dot" style="--cook-color:${cook.color}"></span>
          <span class="cook-summary-name">${cook.name}</span>
          <div class="cook-summary-bar-track"><div class="cook-summary-bar-fill" style="width:${(count / maxCount) * 100}%"></div></div>
          <span class="cook-summary-count">${count}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function render() {
  const feed = document.getElementById('task-feed');
  feed.innerHTML = renderFullBrigade() + renderCookSummary();
  if (!feed.innerHTML.trim()) feed.innerHTML = '<div class="empty-note">אין משימות להצגה</div>';

  feed.querySelectorAll('[data-swipe-id]').forEach((surface) => {
    const id = surface.dataset.swipeId;
    attachSwipeHandlers(surface, (x, y) => {
      spawnRipple(x, y);
      toggleTaskDone(id);
    });
  });
  feed.querySelectorAll('[data-info-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); openSheet(btn.dataset.infoId); });
  });
}

render();
</script>
