<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station Dispatch — Neo-Tactile Utility</title>
<style>
  /* ============================================================================
     DESIGN TOKENS — "Station Dispatch / Neo-Tactile Utility"
     Utilitarian, modular industrial design inspired by Linear / precision studio
     equipment. Crisp solid grays, tactile 1px hairline borders, compact dense
     type. Every token below is commented with its purpose so a human can later
     decide which (if any) belong in src/styles/tokens.css. NONE of this has been
     migrated there — this file is a standalone design exploration only.
     ============================================================================ */
  :root {
    /* --- Surfaces: flat solid grays, no warmth, no gradients --- */
    --bg: #161616;            /* page/app background */
    --surface: #1D1D1D;       /* card background */
    --surface-2: #222222;     /* raised/secondary surface (header, nav, inputs) */
    --surface-3: #262626;     /* hover/pressed surface */
    --border: #333333;        /* the signature hairline border used everywhere */
    --border-strong: #3d3d3d; /* slightly heavier divider, e.g. between segments */

    /* --- Text --- */
    --text: #EDEDED;
    --text-muted: #9A9A9A;
    --text-faint: #6B6B6B;

    /* --- Status / accent palette (kept close to the real app's red/yellow/green
       triad so the *meaning* of each color transfers, but flattened/desaturated
       to fit the industrial palette) --- */
    --accent-blue: #5E9EFF;   /* informational / in-progress */
    --accent-green: #3FB950;  /* on-track / done */
    --accent-amber: #D29922;  /* prep delay warning */
    --accent-red: #F85149;    /* critical timing */
    --focus-ring: #5E9EFF;    /* keyboard focus outline color */

    /* --- Priority triad (maps 1:1 to real app's red/yellow/green semantics) --- */
    --priority-red: var(--accent-red);
    --priority-yellow: var(--accent-amber);
    --priority-green: #4A5A46; /* deliberately muted, not the bright green — in
                                   the real app's .priority-card.green rule, low
                                   priority also gets a neutral/muted border so
                                   that a bright green can unambiguously mean
                                   "done" instead of "low priority" */

    /* --- Radii: this direction favors sharp/near-flat corners over the real
       app's soft 12/20/28px scale — a deliberate industrial-tool departure --- */
    --radius-s: 4px;
    --radius-m: 8px;
    --radius-l: 12px;
    --radius-pill: 999px;

    /* --- Spacing scale (kept identical in spirit to the real app's 4/8/12/16/24/32 step) --- */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    /* --- Type: compact system stack, smaller base size than the real app's
       Rubik-based body text, to fit the "high data density" brief --- */
    --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Roboto Mono', monospace;

    --nav-height: 60px;
    --shadow-sheet: 0 -4px 24px rgba(0,0,0,.4); /* only used on the bottom sheet */
    --toast-shadow: 0 4px 16px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0d0d0d; /* outer page ground, distinct from --bg so the phone frame reads as a device */
    font-family: var(--font-family);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  /* ---- Presentation chrome only: centers the phone-shaped card for desktop
     browser review. Not part of the "app" itself. ---- */
  .frame-label {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #666;
    font-family: var(--font-mono);
  }

  .phone-frame {
    width: 100%;
    max-width: 420px;
    min-height: 840px;
    background: var(--bg);
    border-radius: 28px;
    border: 1px solid #2a2a2a;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 40px 80px rgba(0,0,0,.5);
  }

  /* ============================== HEADER ============================== */
  .app-header {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    padding: var(--space-4) var(--space-4) var(--space-3);
  }
  .header-title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: var(--font-mono); }

  /* Segmented brigade-mode switcher — hard 1px dividers between segments
     ("toolbar" feel), not rounded pill tabs like CategoryTabs in the real app. */
  .brigade-switch {
    display: flex;
    margin-top: var(--space-3);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-s);
    overflow: hidden;
  }
  .brigade-tab {
    flex: 1;
    min-height: 48px;
    background: var(--surface);
    color: var(--text-muted);
    border: none;
    border-inline-start: 1px solid var(--border-strong);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .brigade-tab:first-child { border-inline-start: none; }
  .brigade-tab.active { background: var(--accent-blue); color: #06121F; }

  /* ============================== FEED ============================== */
  .task-feed { flex: 1; overflow-y: auto; padding: var(--space-4); padding-bottom: calc(var(--nav-height) + var(--space-5)); }

  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: var(--space-5) 0 var(--space-2);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .section-header:first-child { margin-top: 0; }
  .section-header .window-range { font-family: var(--font-mono); font-weight: 400; color: var(--text-faint); }

  /* ---- Station group header (Full Brigade mode) ---- */
  .station-section { margin-bottom: var(--space-5); }
  .station-header {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    padding: var(--space-3);
    margin-bottom: var(--space-2);
  }
  .station-name { font-size: 13px; font-weight: 700; }
  .station-row { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-2); }
  .cook-avatars { display: flex; gap: 6px; }
  .cook-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #0b0b0b;
    border: 2px solid var(--surface-2);
  }
  .progress-track { flex: 1; height: 6px; background: var(--surface-3); border-radius: var(--radius-pill); margin-inline-start: var(--space-3); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent-green); border-radius: inherit; transition: width .3s ease; }
  .progress-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-inline-start: var(--space-2); white-space: nowrap; }

  /* ============================== TASK CARD ============================== */
  .task-card { margin-bottom: var(--space-3); }

  /* Priority border — mirrors the real app's .priority-card convention
     (3px colored border, transparent by default) but flattened to 1px here
     to fit the hairline-industrial look; color still carries the same meaning. */
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-m);
    border: 1px solid var(--border);
  }
  .task-card.priority-red .swipe-wrap { border-color: var(--priority-red); }
  .task-card.priority-yellow .swipe-wrap { border-color: var(--priority-yellow); }
  .task-card.priority-green .swipe-wrap { border-color: var(--border); }
  .task-card.status-done .swipe-wrap { border-color: var(--accent-green); background: rgba(63,185,80,.06); }

  /* The reveal panel behind the swipe surface — flat solid color, monospace
     [DONE] label, no rounding: deliberately more "ops tool" than "app". */
  .swipe-action {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-green);
    color: #06210D;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .08em;
  }

  .swipe-surface {
    position: relative;
    background: var(--surface);
    touch-action: pan-y;
    user-select: none;
    min-height: 48px;
  }

  .task-card-inner { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-3); cursor: pointer; }
  .task-main { flex: 1; min-width: 0; }

  .status-dot {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; margin-top: 3px;
    border: 2px solid var(--border-strong);
  }
  .status-dot.status-pending { background: transparent; }
  .status-dot.status-inProgress { background: var(--accent-blue); border-color: var(--accent-blue); animation: pulse-ring 1.6s ease-out infinite; }
  .status-dot.status-paused { background: var(--accent-amber); border-color: var(--accent-amber); }
  .status-dot.status-done { background: var(--accent-green); border-color: var(--accent-green); }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(94,158,255,.5); }
    70% { box-shadow: 0 0 0 7px rgba(94,158,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(94,158,255,0); }
  }

  .task-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .task-card.status-done .task-title { text-decoration: line-through; opacity: .5; }

  /* Dependency indicator — an "Atelier"-signature detail per the design brief,
     kept in the shared markup for structural parity but hidden by default in
     the other two directions so each file's <style> alone decides whether it
     reads as a headline feature or stays invisible. */
  .task-dependency { display: none; }

  .task-meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); margin-top: 6px; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
  .task-meta .meta-item { display: flex; align-items: center; gap: 4px; }

  .priority-pill {
    display: inline-flex; align-items: center; border-radius: var(--radius-s);
    padding: 2px 6px; font-size: 10px; font-weight: 700; font-family: var(--font-mono);
    border: 1px solid currentColor;
  }
  .priority-pill.pill-red { color: var(--priority-red); }
  .priority-pill.pill-yellow { color: var(--priority-yellow); }
  .priority-pill.pill-green { color: var(--text-faint); }

  .assignee-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px 2px 2px; border-radius: var(--radius-pill);
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted);
  }
  .assignee-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--cook-color, #888); }

  .info-btn {
    width: 40px; height: 40px; min-width: 40px; border-radius: var(--radius-s);
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); font-size: 16px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .info-btn:hover { background: var(--surface-3); color: var(--text); }

  /* ---- StationDispatch-exclusive: brigade reassignment flyout ----
     A small anchored popover (not a full sheet) triggered from a cook avatar
     tap in Full Brigade mode — a lighter-weight affordance unique to this
     "dispatch" direction, per the design brief's own feature list. */
  .reassign-popover {
    position: absolute;
    z-index: 40;
    min-width: 160px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-m);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    padding: var(--space-1);
    display: none;
  }
  .reassign-popover.open { display: block; }
  .reassign-popover-item {
    display: flex; align-items: center; gap: var(--space-2);
    width: 100%; min-height: 44px; padding: 0 var(--space-2);
    background: none; border: none; color: var(--text); font-size: 13px;
    border-radius: var(--radius-s); cursor: pointer; font-family: inherit;
  }
  .reassign-popover-item:hover { background: var(--surface-3); }
  .reassign-popover-item .check { margin-inline-start: auto; color: var(--accent-green); }
  .reassign-popover-divider { height: 1px; background: var(--border); margin: 4px 2px; }

  /* ============================== BOTTOM NAV (decorative) ============================== */
  .bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    height: var(--nav-height);
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-faint); font-size: 10px; }
  .nav-item.active { color: var(--accent-blue); }
  .nav-icon { font-size: 16px; }

  /* ============================== BOTTOM SHEET ============================== */
  /* NOTE: the real app's BottomSheet.tsx has NO transition at all — it mounts
     instantly via React conditional render. The animated spring slide-up below
     is a deliberate, net-new ergonomic improvement proposed by this prototype,
     not a port of existing behavior. */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
    pointer-events: none;
    transition: background .25s ease;
  }
  .overlay.open { background: rgba(0,0,0,.6); pointer-events: auto; }

  .sheet {
    width: 100%; max-width: 420px;
    background: var(--surface-2);
    border-top: 1px solid var(--border-strong);
    border-radius: var(--radius-l) var(--radius-l) 0 0;
    max-height: 82vh;
    overflow-y: auto;
    padding: var(--space-5) var(--space-4) var(--space-6);
    box-shadow: var(--shadow-sheet);
    transform: translateY(100%);
    /* Spring-ish overshoot easing — the "Mobbin-grade" slide-up feel requested
       in the brief, applied uniformly to all three directions (only the easing
       curve constants are shared; each direction may retune duration/curve). */
    transition: transform .38s cubic-bezier(.34, 1.56, .64, 1);
  }
  .overlay.open .sheet { transform: translateY(0); }

  .sheet-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--space-4); }
  .sheet-title { font-size: 16px; font-weight: 700; }
  .sheet-close {
    width: 40px; height: 40px; border-radius: var(--radius-s);
    background: var(--surface-3); border: 1px solid var(--border); color: var(--text);
    font-size: 16px; cursor: pointer;
  }

  .sheet-meta-row { display: flex; justify-content: space-between; padding: var(--space-2) 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sheet-meta-row .meta-label { color: var(--text-muted); }
  .sheet-meta-row .meta-value { font-family: var(--font-mono); text-align: end; }

  .sheet-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin: var(--space-4) 0 var(--space-2); }

  .checklist-item { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; font-size: 13px; }
  .checklist-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent-green); }
  .checklist-qty { font-family: var(--font-mono); color: var(--text-muted); margin-inline-start: auto; }

  .step-list { margin: 0; padding-inline-start: 20px; font-size: 13px; line-height: 1.7; color: var(--text); }
  .step-list li { margin-bottom: 4px; }

  /* ============================== TOASTS ============================== */
  #toast-root {
    position: fixed;
    left: 50%;
    bottom: calc(var(--nav-height) + 16px);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 200;
    pointer-events: none;
    width: calc(100% - 32px);
    max-width: 380px;
    align-items: center;
  }
  .toast {
    pointer-events: auto;
    padding: 10px 16px;
    border-radius: var(--radius-s);
    font-size: 12.5px;
    font-weight: 600;
    box-shadow: var(--toast-shadow);
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text);
    opacity: 0;
    transform: translateY(8px);
    animation: toast-in .22s ease forwards, toast-out .22s ease 2.6s forwards;
    max-width: 100%;
  }
  .toast.tone-success { border-color: var(--accent-green); color: var(--accent-green); }
  .toast.tone-info { border-color: var(--accent-amber); color: var(--accent-amber); }
  .toast.tone-alert { border-color: var(--accent-red); color: var(--accent-red); }
  @keyframes toast-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

  /* ============================== SHARED TACTILE / A11Y UTILITY ============================== */
  /* Applied to every interactive control: >=48px comfortable targets on the
     controls that need it, a fast "press" scale-down for tactile feedback, and
     a keyboard-only focus ring (never shown on a plain mouse click). */
  .tappable { transition: transform .1s ease; }
  .tappable:active { transform: scale(0.96); }
  .tappable:focus-visible,
  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  .empty-note { text-align: center; color: var(--text-faint); font-size: 12px; padding: var(--space-4); }
</style>
</head>
<body>
  <div class="frame-label">STATION DISPATCH · NEO-TACTILE UTILITY</div>

  <div class="phone-frame">
    <header class="app-header">
      <div class="header-title">מטבח האומן — משמרת ערב</div>
      <div class="header-sub">יום שלישי · 12/09 · 5 משימות פעילות</div>
      <div class="brigade-switch" role="tablist" aria-label="מצב תצוגה">
        <button type="button" class="brigade-tab tappable active" role="tab" aria-selected="true" data-mode="compact">קו קומפקטי (יחיד/זוג)</button>
        <button type="button" class="brigade-tab tappable" role="tab" aria-selected="false" data-mode="full">בריגדה מלאה (תחנות)</button>
      </div>
    </header>

    <main class="task-feed" id="task-feed"></main>

    <nav class="bottom-nav" aria-hidden="true">
      <div class="nav-item active"><span class="nav-icon">🏠</span>בית</div>
      <div class="nav-item"><span class="nav-icon">✓</span>משימות</div>
      <div class="nav-item"><span class="nav-icon">🧺</span>מצרכים</div>
      <div class="nav-item"><span class="nav-icon">📖</span>מתכונים</div>
      <div class="nav-item"><span class="nav-icon">⋯</span>עוד</div>
    </nav>
  </div>

  <div id="sheet-root">
    <div class="overlay" id="overlay">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-header">
          <h2 class="sheet-title" id="sheet-title">—</h2>
          <button type="button" class="sheet-close tappable" id="sheet-close-btn" aria-label="סגור">✕</button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>

  <div id="toast-root" aria-live="polite"></div>

  <div id="reassign-popover" class="reassign-popover" role="menu"></div>

<script>
/* ==========================================================================
   SHARED ENGINE — this <script> block is intentionally near-identical across
   all three Direction-*.html files (StationDispatch / MichelinCockpit /
   AtelierChef), so the three prototypes are a fair like-for-like comparison
   of VISUAL direction only, not of differing behavior. The one exception is
   the "StationDispatch-exclusive" reassignment-popover block at the very end,
   called out explicitly in its own comment.
   ========================================================================== */

// ---- Mock data -----------------------------------------------------------
// Real category enum, from src/types.ts (RecipeCategory) — drives Compact
// Line's grouping/labels 1:1 with the real app.
const CATEGORY_LABELS = { cold: 'פס קר', hot: 'פס חם', taboon: 'טאבון', dessert: 'קינוחים', general: 'כללי' };

// ILLUSTRATIVE ONLY. The real app has no brigade-station concept — its only
// station-like field is the 5-value RecipeCategory above. These station names
// exist purely to demonstrate the "Full Brigade" design concept; a real
// implementation would need to extend RecipeCategory or add a separate
// station-assignment field to support this view for real.
const BRIGADE_STATIONS = {
  garde_manger: { label: 'Garde-Manger · פס קר' },
  saucier: { label: 'Saucier · פס חם' },
  patissier: { label: 'Pâtissier · קינוחים' },
};

const TIME_WINDOWS = {
  preService: { label: 'לפני שירות', range: '10:00–16:30' },
  serviceRush: { label: 'שיא השירות', range: '17:00–22:30' },
  closeout: { label: 'סגירה', range: '22:30–23:30' },
};

const PRIORITY_LABELS = { red: 'דחוף', yellow: 'לא דחוף', green: 'לא צריך' };
const STATUS_LABELS = { pending: 'ממתין', inProgress: 'בעבודה', paused: 'בהשהיה', done: 'הושלם' };
const STATUS_CYCLE = ['pending', 'inProgress', 'paused', 'done'];

const COOKS = [
  { id: 'c1', name: 'דניאל', color: '#e8446a' },
  { id: 'c2', name: 'נועה', color: '#1c8a6c' },
  { id: 'c3', name: 'עומר', color: '#c99a2e' },
];

// Mirrors DisplayTask (src/lib/tasks.ts) + prototype-only fields (status,
// targetTemp, deadline, station, dependency, ingredients, steps) that don't
// exist on the real type — those are purely for this mockup's detail sheet.
const MOCK_TASKS = [
  {
    id: 't1', title: 'התחלת ייבוש יבש — אנטריקוט 21 יום', category: 'cold', station: 'garde_manger',
    timeWindow: 'preService', priority: 'yellow', assigneeId: 'c1', status: 'pending',
    targetTemp: '1–3°C · לחות 82%', deadline: '06:30',
    dependency: 'יש לתעד תאריך התחלה על התווית לפני העברה לתא הייבוש',
    ingredients: [{ name: 'אנטריקוט שלם', qty: '4', unit: 'ק"ג' }, { name: 'מלח גס', qty: '0.2', unit: 'ק"ג' }],
    steps: ['לשטוף ולייבש חתיכה במגבת נייר', 'לסדר על רשת בתא ייבוש', 'לתעד תאריך התחלה על התווית'],
  },
  {

// ---- State -----------------------------------------------------------
const state = {
  brigadeMode: 'compact', // 'compact' | 'full'
  tasks: MOCK_TASKS.map((t) => ({ ...t })), // shallow-cloned so this demo can mutate freely
  activeSheetTaskId: null,
  toastSeq: 0,
};

function cookById(id) { return COOKS.find((c) => c.id === id); }
function taskById(id) { return state.tasks.find((t) => t.id === id); }

function cycleTaskStatus(taskId) {
  const task = taskById(taskId);
  if (!task) return;
  const idx = STATUS_CYCLE.indexOf(task.status);
  task.status = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
  render();
}

function completeTask(taskId) {
  const task = taskById(taskId);
  if (!task || task.status === 'done') return;
  task.status = 'done';
  pushToast(`הושלם: ${task.title}`, 'success');
  render();
}

function setBrigadeMode(mode) {
  state.brigadeMode = mode;
  document.querySelectorAll('.brigade-tab').forEach((btn) => {
    const active = btn.dataset.mode === mode;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
  render();
}

// ---- Toasts -----------------------------------------------------------
function pushToast(message, tone) {
  tone = tone || 'success';
  const id = 'toast-' + (++state.toastSeq);
  const el = document.createElement('div');
  el.className = `toast tone-${tone}`;
  el.id = id;
  el.textContent = message;
  el.addEventListener('click', () => el.remove());
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => { const n = document.getElementById(id); if (n) n.remove(); }, 3000);
}

// ---- Bottom sheet -----------------------------------------------------------
function openSheet(taskId) {
  const task = taskById(taskId);
  if (!task) return;
  state.activeSheetTaskId = taskId;
  const cook = cookById(task.assigneeId);

  document.getElementById('sheet-title').textContent = task.title;
  document.getElementById('sheet-body').innerHTML = `
    <div class="sheet-meta-row"><span class="meta-label">תחנה</span><span class="meta-value">${CATEGORY_LABELS[task.category]}</span></div>
    <div class="sheet-meta-row"><span class="meta-label">טמפרטורת יעד</span><span class="meta-value">${task.targetTemp}</span></div>
    <div class="sheet-meta-row"><span class="meta-label">דדליין</span><span class="meta-value">${task.deadline}</span></div>
    <div class="sheet-meta-row"><span class="meta-label">אחראי</span><span class="meta-value">${cook ? cook.name : '—'}</span></div>
    <div class="sheet-meta-row"><span class="meta-label">סטטוס</span><span class="meta-value">${STATUS_LABELS[task.status]}</span></div>

    <div class="sheet-section-title">רשימת מצרכים</div>
    ${task.ingredients.map((ing, i) => `
      <label class="checklist-item">
        <input type="checkbox" id="chk-${task.id}-${i}">
        <span>${ing.name}</span>
        <span class="checklist-qty">${ing.qty} ${ing.unit}</span>
      </label>
    `).join('')}

    <div class="sheet-section-title">אופן הכנה</div>
    <ol class="step-list">${task.steps.map((s) => `<li>${s}</li>`).join('')}</ol>
  `;

  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  // Double rAF so the browser commits the pre-open state before adding
  // .open — otherwise the transform:translateY(100%) -> 0 transition
  // wouldn't have a starting frame to animate from.
  requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('open')));
}

function closeSheet() {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('open');
  setTimeout(() => { overlay.style.display = 'none'; }, 400);
  state.activeSheetTaskId = null;
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeSheet();
});
document.getElementById('sheet-close-btn').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.activeSheetTaskId !== null) closeSheet();
});

// ---- Swipe-to-complete (Pointer Events: unifies mouse + touch in one path —
// a deliberate widening of the real app's touch-only SwipeToComplete.tsx, so
// this prototype is fully testable with a mouse in a desktop browser). Ports
// the exact dead-zone/threshold constants from src/lib/swipe.ts. -----------
function attachSwipeHandlers(surfaceEl, onCommit) {
  const DEAD_ZONE = 8;
  const COMPLETE_FRACTION = 0.4;
  const COMPLETE_MIN_PX = 96;
  let startX = 0, startY = 0, dx = 0, axis = 'undecided', dragging = false;

  surfaceEl.style.touchAction = 'pan-y';

  surfaceEl.addEventListener('pointerdown', (e) => {
    dragging = true;
    startX = e.clientX; startY = e.clientY; dx = 0; axis = 'undecided';
    surfaceEl.setPointerCapture(e.pointerId);
    surfaceEl.style.transition = 'none';
  });

  surfaceEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const ddx = e.clientX - startX;
    const ddy = e.clientY - startY;
    if (axis === 'undecided') {
      if (Math.abs(ddx) < DEAD_ZONE && Math.abs(ddy) < DEAD_ZONE) return;
      axis = Math.abs(ddx) > Math.abs(ddy) ? 'horizontal' : 'vertical';
    }
    if (axis !== 'horizontal') return;
    dx = ddx;
    surfaceEl.style.transform = `translateX(${dx}px)`;
  });

  function release() {
    if (!dragging) return;
    dragging = false;
    const width = surfaceEl.offsetWidth || 1;
    const threshold = Math.max(width * COMPLETE_FRACTION, COMPLETE_MIN_PX);
    surfaceEl.style.transition = 'transform .2s ease';
    if (axis === 'horizontal' && Math.abs(dx) >= threshold) {
      surfaceEl.style.transform = `translateX(${dx < 0 ? -width : width}px)`;
      onCommit();
      setTimeout(() => { surfaceEl.style.transition = 'none'; surfaceEl.style.transform = ''; }, 210);
    } else {
      surfaceEl.style.transform = 'translateX(0)';
    }
    axis = 'undecided'; dx = 0;
  }

  surfaceEl.addEventListener('pointerup', release);
  surfaceEl.addEventListener('pointercancel', release);
}

// ---- Rendering -----------------------------------------------------------
function renderTaskCard(task) {
  const cook = cookById(task.assigneeId);
  return `
    <div class="task-card priority-${task.priority} status-${task.status}" data-id="${task.id}">
      <div class="swipe-wrap">
        <div class="swipe-action">✓ [DONE]</div>
        <div class="swipe-surface tappable" data-swipe-id="${task.id}">
          <div class="task-card-inner" data-cycle-id="${task.id}">
            <span class="status-dot status-${task.status}"></span>
            <div class="task-main">
              <div class="task-title">${task.title}</div>
              <div class="task-dependency">${task.dependency || ''}</div>
              <div class="task-meta">
                <span class="priority-pill pill-${task.priority}">${PRIORITY_LABELS[task.priority]}</span>
                <span class="meta-item">⏱ ${task.deadline}</span>
                <span class="meta-item">${STATUS_LABELS[task.status]}</span>
                ${cook ? `<span class="assignee-pill"><span class="assignee-dot" style="--cook-color:${cook.color}"></span>${cook.name}</span>` : ''}
              </div>
            </div>
            <button type="button" class="info-btn tappable" data-info-id="${task.id}" aria-label="פרטי משימה">›</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderCompact() {
  const order = ['preService', 'serviceRush', 'closeout'];
  const priorityOrder = { red: 0, yellow: 1, green: 2 };
  let html = '';
  order.forEach((win) => {
    const tasks = state.tasks
      .filter((t) => t.timeWindow === win)
      .sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
    if (tasks.length === 0) return;
    html += `<div class="section-header"><span>${TIME_WINDOWS[win].label}</span><span class="window-range">${TIME_WINDOWS[win].range}</span></div>`;
    html += tasks.map(renderTaskCard).join('');
  });
  return html;
}

function renderFullBrigade() {
  let html = '';
  Object.keys(BRIGADE_STATIONS).forEach((stationKey) => {
    const tasks = state.tasks.filter((t) => t.station === stationKey);
    if (tasks.length === 0) return;
    const station = BRIGADE_STATIONS[stationKey];
    const assignedCookIds = [...new Set(tasks.map((t) => t.assigneeId))];
    const doneCount = tasks.filter((t) => t.status === 'done').length;
    const pct = Math.round((doneCount / tasks.length) * 100);
    html += `
      <div class="station-section">
        <div class="station-header">
          <div class="station-name">${station.label}</div>
          <div class="station-row">
            <div class="cook-avatars">
              ${assignedCookIds.map((id) => {
                const c = cookById(id);
                return `<button type="button" class="cook-avatar tappable" style="background:${c.color}" data-reassign-cook="${id}" data-reassign-station="${stationKey}" title="${c.name}">${c.name[0]}</button>`;
              }).join('')}
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label">${doneCount}/${tasks.length}</div>
          </div>
        </div>
        ${tasks.map(renderTaskCard).join('')}
      </div>
    `;
  });
  return html;
}

function render() {
  const feed = document.getElementById('task-feed');
  feed.innerHTML = state.brigadeMode === 'compact' ? renderCompact() : renderFullBrigade();
  if (!feed.innerHTML.trim()) feed.innerHTML = '<div class="empty-note">אין משימות להצגה</div>';

  // Wire up interactions for the freshly-rendered DOM.
  feed.querySelectorAll('[data-swipe-id]').forEach((surface) => {
    const id = surface.dataset.swipeId;
    attachSwipeHandlers(surface, () => completeTask(id));
  });
  feed.querySelectorAll('[data-cycle-id]').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-info-id]') || e.target.closest('[data-reassign-cook]')) return;
      cycleTaskStatus(el.dataset.cycleId);
    });
  });
  feed.querySelectorAll('[data-info-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); openSheet(btn.dataset.infoId); });
  });
  feed.querySelectorAll('[data-reassign-cook]').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); openReassignPopover(btn); });
  });
}

// ---- Wiring -----------------------------------------------------------
document.querySelectorAll('.brigade-tab').forEach((btn) => {
  btn.addEventListener('click', () => setBrigadeMode(btn.dataset.mode));
});

render();

/* ==========================================================================
   STATION-DISPATCH-EXCLUSIVE: brigade reassignment flyout.
   A small anchored popover (not a full BottomSheet) for reassigning a cook
   at a station, triggered by tapping a cook avatar in Full Brigade mode.
   This affordance is unique to this direction per the design brief's own
   feature list ("brigade reassignment flyouts") — the other two Direction
   files do not include this block.
   ========================================================================== */
function openReassignPopover(anchorBtn) {
  const popover = document.getElementById('reassign-popover');
  const stationKey = anchorBtn.dataset.reassignStation;
  const currentCookId = anchorBtn.dataset.reassignCook;

  popover.innerHTML = COOKS.map((c) => `
    <button type="button" class="reassign-popover-item tappable" data-assign-cook="${c.id}">
      <span class="assignee-dot" style="--cook-color:${c.color}"></span>
      ${c.name}
      ${c.id === currentCookId ? '<span class="check">✓</span>' : ''}
    </button>
  `).join('');

  // #reassign-popover is a direct child of <body> (not of .phone-frame), and
  // nothing between it and the viewport is positioned, so its `position:
  // absolute` containing block IS the viewport — plain viewport-relative
  // coordinates from getBoundingClientRect() are what's needed here. Anchored
  // from the avatar's physical-RIGHT edge growing leftward (via `right`, not
  // `left`) since in this RTL layout the avatar sits near the frame's right
  // edge — opening rightward would spill the popover out of the phone frame.
  const rect = anchorBtn.getBoundingClientRect();
  popover.style.top = (rect.bottom + 6) + 'px';
  popover.style.right = (window.innerWidth - rect.right) + 'px';
  popover.style.left = 'auto';
  popover.classList.add('open');

  popover.querySelectorAll('[data-assign-cook]').forEach((item) => {
    item.addEventListener('click', () => {
      const newCookId = item.dataset.assignCook;
      state.tasks.filter((t) => t.station === stationKey).forEach((t) => { t.assigneeId = newCookId; });
      popover.classList.remove('open');
      pushToast(`${cookById(newCookId).name} שובץ לתחנת ${BRIGADE_STATIONS[stationKey].label}`, 'info');
      render();
    });
  });

  function outsideClick(e) {
    if (!popover.contains(e.target) && e.target !== anchorBtn) {
      popover.classList.remove('open');
      document.removeEventListener('click', outsideClick, true);
    }
  }
  setTimeout(() => document.addEventListener('click', outsideClick, true), 0);
}
</script>
