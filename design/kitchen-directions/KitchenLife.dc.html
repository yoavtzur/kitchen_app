<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Suez+One&display=swap" rel="stylesheet">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Assistant', system-ui, sans-serif; direction: rtl; }
    a { color: #D2603B; } a:hover { color: #B04A29; }
    .display { font-family: 'Suez One', 'Assistant', serif; }

    @keyframes steam-rise {
      0%   { transform: translateY(0) scaleX(1); opacity: 0; }
      15%  { opacity: 0.55; }
      80%  { opacity: 0.15; }
      100% { transform: translateY(-22px) scaleX(1.3); opacity: 0; }
    }
    @keyframes flicker { 0%,100% { transform: scaleY(1); opacity: 0.9; } 50% { transform: scaleY(0.82); opacity: 0.6; } }
    @keyframes bob-a { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
    @keyframes bob-b { 0%,100% { transform: translateY(0) rotate(4deg); } 50% { transform: translateY(6px) rotate(-3deg); } }
    @keyframes simmer { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  </style>
</helmet>

<div style="position: relative; width: 100%; height: 100%; background: #FBF1E3; overflow: hidden;" dir="rtl">

  <div style="position: relative; padding: 24px 22px 92px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h1 class="display" style="margin: 0; font-size: 26px; font-weight: 400; color: #3B2A1E;">ניהול מטבח</h1>
        <div style="font-size: 13px; font-weight: 600; color: #9A8873;">יום שבת, 5/9</div>
      </div>

      <div style="position: relative; width: 76px; height: 68px; flex-shrink: 0;">
        <svg width="14" height="26" viewBox="0 0 14 26" style="position: absolute; top: -14px; right: 30px;">
          <path d="M3 24c3-4-3-6 0-10s-3-6 0-10" fill="none" stroke="#C9BBA6" stroke-width="2" stroke-linecap="round" style="animation: steam-rise 2.6s ease-in-out infinite;"/>
        </svg>
        <svg width="14" height="26" viewBox="0 0 14 26" style="position: absolute; top: -18px; right: 44px;">
          <path d="M3 24c3-4-3-6 0-10s-3-6 0-10" fill="none" stroke="#C9BBA6" stroke-width="2" stroke-linecap="round" style="animation: steam-rise 2.6s ease-in-out infinite; animation-delay: 0.9s;"/>
        </svg>
        <svg width="14" height="26" viewBox="0 0 14 26" style="position: absolute; top: -12px; right: 18px;">
          <path d="M3 24c3-4-3-6 0-10s-3-6 0-10" fill="none" stroke="#C9BBA6" stroke-width="2" stroke-linecap="round" style="animation: steam-rise 2.6s ease-in-out infinite; animation-delay: 1.7s;"/>
        </svg>

        <svg width="60" height="40" viewBox="0 0 60 40" style="position: absolute; bottom: 6px; right: 8px;">
          <ellipse cx="30" cy="10" rx="19" ry="4.5" fill="#8A7461"/>
          <path d="M11 10h38l-4 22a5 5 0 0 1-5 4H20a5 5 0 0 1-5-4z" fill="{{accent}}"/>
          <rect x="2" y="14" width="9" height="4" rx="2" fill="{{accent}}"/>
          <rect x="49" y="14" width="9" height="4" rx="2" fill="{{accent}}"/>
          <ellipse cx="30" cy="10" rx="14" ry="3" fill="#F3C77E"/>
        </svg>

        <svg width="16" height="14" viewBox="0 0 16 14" style="position: absolute; bottom: -2px; right: 30px; animation: flicker 1.1s ease-in-out infinite; transform-origin: bottom center;">
          <path d="M8 0c2 3-1 4 1 6.5C11 9 9 13 8 14 3 12 2 8 4 5c1 2 2 1 1-1 1 1 3 0 3-4z" fill="#E3A857"/>
        </svg>

        <svg width="20" height="20" viewBox="0 0 20 20" style="position: absolute; top: -6px; left: -2px; animation: bob-a 3.4s ease-in-out infinite;">
          <circle cx="10" cy="11" r="8" fill="#C2483A"/>
          <path d="M8 3.5c1-1.5 3-1.5 4 0" stroke="#7C9473" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        <svg width="16" height="18" viewBox="0 0 16 18" style="position: absolute; bottom: 4px; left: -8px; animation: bob-b 3.9s ease-in-out infinite;">
          <path d="M8 1c4 2 5 7 4 11-1 3-3 4-4 4s-3-1-4-4c-1-4 0-9 4-11z" fill="#F3ECD9" stroke="#D8C9AE" stroke-width="1"/>
          <path d="M8 1v16" stroke="#D8C9AE" stroke-width="0.8"/>
        </svg>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="background: #FFFDF8; border-radius: 16px; padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
        <div style="font-size: 22px; font-weight: 800; color: #C2483A;">1</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #8A7461;">דחוף היום</div>
      </div>
      <div style="background: #FFFDF8; border-radius: 16px; padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
        <div style="font-size: 22px; font-weight: 800; color: #B8862F;">1</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #8A7461;">משימות פתוחות</div>
      </div>
      <div style="background: #FFFDF8; border-radius: 16px; padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
        <div style="font-size: 22px; font-weight: 800; color: #7C9473;">0</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #8A7461;">מצרכים חסרים</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="display" style="font-size: 17px; font-weight: 400; color: #3B2A1E;">להכין היום</div>
      <div style="background: #FFFDF8; border-radius: 18px; padding: 15px 16px; display: flex; align-items: center; justify-content: space-between; border-inline-start: 4px solid {{accent}}; box-shadow: 0 3px 10px rgba(59,42,30,0.07);">
        <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
          <div style="position: relative; width: 14px; height: 14px; flex-shrink: 0;">
            <div style="position: absolute; inset: 0; border-radius: 50%; background: {{accent}}; animation: simmer 1.6s ease-in-out infinite; opacity: 0.35;"></div>
            <div style="position: absolute; inset: 3px; border-radius: 50%; background: {{accent}};"></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 15px; font-weight: 700; color: #3B2A1E;">קרם ברולה</div>
            <div style="font-size: 12.5px; font-weight: 600; color: #9A8873;">מתכון &times;1.5</div>
          </div>
        </div>
        <div style="background: #F3E7D2; color: #8A5A2E; font-weight: 800; font-size: 13.5px; border-radius: 12px; padding: 7px 12px; flex-shrink: 0;">3 יח&#39;</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="display" style="font-size: 17px; font-weight: 400; color: #3B2A1E;">מלאי מוכן</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">

        <div style="background: #FFFDF8; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
          <div style="font-size: 13.5px; font-weight: 700; color: #3B2A1E;">קרם ברולה</div>
          <div style="font-size: 12px; font-weight: 700; color: #7C9473;">3 יח&#39;</div>
        </div>
        <div style="background: #FFFDF8; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
          <div style="font-size: 13.5px; font-weight: 700; color: #3B2A1E;">בצק לפיצות</div>
          <div style="font-size: 12px; font-weight: 700; color: #7C9473;">12 יח&#39;</div>
        </div>
        <div style="background: #FFFDF8; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
          <div style="font-size: 13.5px; font-weight: 700; color: #3B2A1E;">ארנצ&#39;יני</div>
          <div style="font-size: 12px; font-weight: 700; color: #7C9473;">40 יח&#39;</div>
        </div>
        <div style="background: #FFFDF8; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
          <div style="font-size: 13.5px; font-weight: 700; color: #3B2A1E;">סלסת עגבניות</div>
          <div style="font-size: 12px; font-weight: 700; color: #7C9473;">1 ליטר</div>
        </div>
        <div style="background: #FFFDF8; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
          <div style="font-size: 13.5px; font-weight: 700; color: #3B2A1E;">סלט ביצים</div>
          <div style="font-size: 12px; font-weight: 700; color: #B8862F;">0.5 ליטר</div>
        </div>
        <div style="background: #FFFDF8; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 6px rgba(59,42,30,0.06);">
          <div style="font-size: 13.5px; font-weight: 700; color: #3B2A1E;">קרם זוקיני</div>
          <div style="font-size: 12px; font-weight: 700; color: #B8862F;">0.5 ליטר</div>
        </div>

      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 0; right: 0; left: 0; height: 74px; background: #FFFDF8; border-top: 1px solid #EFE2CB; display: flex; align-items: center; justify-content: space-around; padding: 0 6px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: rgba(210,96,59,0.12); display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/></svg>
      </div>
      <div style="font-size: 10.5px; font-weight: 700; color: #3B2A1E;">בית</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B79C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.3l2.4 2.4 5-5"/></svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #9A8873;">משימות</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B79C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.5 9.2a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 9z"/><path d="M8.5 9 10 4M15.5 9 14 4"/></svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #9A8873;">מצרכים</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B79C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.2a2 2 0 0 1 2-2h6v17.6H6a2 2 0 0 1-2-2V5.2z"/><path d="M20 5.2a2 2 0 0 0-2-2h-6v17.6h6a2 2 0 0 0 2-2V5.2z"/></svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #9A8873;">מתכונים</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B79C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #9A8873;">צריכה</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B79C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>
      <div style="font-size: 10.5px; font-weight: 600; color: #9A8873;">עוד</div>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D2603B","options":["#D2603B","#7C9473","#B8862F","#A64A3C"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D2603B' };
  }
}
</script>
</body>
</html>
