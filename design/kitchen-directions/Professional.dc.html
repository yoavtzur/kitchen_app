<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Assistant', system-ui, sans-serif; direction: rtl; }
    a { color: #0F6E5C; } a:hover { color: #0B4F42; }
    .tabnum { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="position: relative; width: 100%; height: 100%; background: #FAFAF8; overflow: hidden;" dir="rtl">

  <div style="position: absolute; inset: 0 0 auto 0; height: 180px; background: radial-gradient(120% 100% at 100% 0%, rgba(15,110,92,0.10), transparent 60%);"></div>

  <div style="position: relative; padding: 30px 22px 92px; display: flex; flex-direction: column; gap: 22px;">

    <div style="display: flex; align-items: flex-start; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #0F6E5C;">לוח בקרה</div>
        <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #17171A; line-height: 1.2;">ניהול מטבח</h1>
        <div style="font-size: 13px; font-weight: 500; color: #8A8A90;">יום שבת, 5/9</div>
      </div>

      <div style="position: relative; width: 58px; height: 58px; flex-shrink: 0;">
        <svg width="58" height="58" viewBox="0 0 58 58">
          <circle cx="29" cy="29" r="24" fill="none" stroke="#E9E9E6" stroke-width="5"/>
          <circle cx="29" cy="29" r="24" fill="none" stroke="{{accent}}" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="150.8" stroke-dashoffset="27" transform="rotate(-90 29 29)"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #17171A;" class="tabnum">82%</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">

      <div style="background: #FFFFFF; border: 1px solid #E9E9E6; border-radius: 12px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #C2483A;"></div>
        <div style="font-size: 22px; font-weight: 800; color: #17171A;" class="tabnum">1</div>
        <div style="font-size: 11.5px; font-weight: 600; color: #8A8A90;">דחוף היום</div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E9E9E6; border-radius: 12px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #8A8A90;"></div>
        <div style="font-size: 22px; font-weight: 800; color: #17171A;" class="tabnum">1</div>
        <div style="font-size: 11.5px; font-weight: 600; color: #8A8A90;">משימות פתוחות</div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E9E9E6; border-radius: 12px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: {{accent}};"></div>
        <div style="font-size: 22px; font-weight: 800; color: #17171A;" class="tabnum">0</div>
        <div style="font-size: 11.5px; font-weight: 600; color: #8A8A90;">מצרכים חסרים</div>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #8A8A90;">להכין היום</div>
      <div style="background: #FFFFFF; border: 1px solid #E9E9E6; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-inline-start: 3px solid #C2483A;">
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <div style="font-size: 14.5px; font-weight: 700; color: #17171A;">קרם ברולה</div>
          <div style="font-size: 12px; font-weight: 500; color: #8A8A90;">מתכון &times;1.5</div>
        </div>
        <div style="font-size: 14px; font-weight: 700; color: #17171A; flex-shrink: 0;" class="tabnum">3 יח&#39;</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #8A8A90;">מלאי מוכן</div>
      <div style="background: #FFFFFF; border: 1px solid #E9E9E6; border-radius: 12px; overflow: hidden;">

        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #F0F0EE;">
          <span style="font-size: 13.5px; font-weight: 600; color: #17171A;">קרם ברולה</span>
          <span style="font-size: 13px; font-weight: 700; color: #17171A;" class="tabnum">3 יח&#39;</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #F0F0EE;">
          <span style="font-size: 13.5px; font-weight: 600; color: #17171A;">בצק לפיצות</span>
          <span style="font-size: 13px; font-weight: 700; color: #17171A;" class="tabnum">12 יח&#39;</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #F0F0EE;">
          <span style="font-size: 13.5px; font-weight: 600; color: #17171A;">ארנצ&#39;יני</span>
          <span style="font-size: 13px; font-weight: 700; color: #17171A;" class="tabnum">40 יח&#39;</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #F0F0EE;">
          <span style="font-size: 13.5px; font-weight: 600; color: #17171A;">סלסת עגבניות</span>
          <span style="font-size: 13px; font-weight: 700; color: #17171A;" class="tabnum">1 ליטר</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #F0F0EE;">
          <span style="font-size: 13.5px; font-weight: 600; color: #17171A;">סלט ביצים</span>
          <span style="font-size: 13px; font-weight: 700; color: #B8862F;" class="tabnum">0.5 ליטר</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;">
          <span style="font-size: 13.5px; font-weight: 600; color: #17171A;">קרם זוקיני</span>
          <span style="font-size: 13px; font-weight: 700; color: #B8862F;" class="tabnum">0.5 ליטר</span>
        </div>

      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 0; right: 0; left: 0; height: 68px; background: #FFFFFF; border-top: 1px solid #EDEDEA; display: flex; align-items: center; justify-content: space-around; padding: 0 4px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <div style="width: 32px; height: 32px; border-radius: 9px; background: rgba(15,110,92,0.10); display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/></svg>
      </div>
      <div style="font-size: 10px; font-weight: 700; color: #17171A;">בית</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4B4B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.3l2.4 2.4 5-5"/></svg>
      <div style="font-size: 10px; font-weight: 600; color: #9A9A96;">משימות</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4B4B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.5 9.2a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 9z"/><path d="M8.5 9 10 4M15.5 9 14 4"/></svg>
      <div style="font-size: 10px; font-weight: 600; color: #9A9A96;">מצרכים</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4B4B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.2a2 2 0 0 1 2-2h6v17.6H6a2 2 0 0 1-2-2V5.2z"/><path d="M20 5.2a2 2 0 0 0-2-2h-6v17.6h6a2 2 0 0 0 2-2V5.2z"/></svg>
      <div style="font-size: 10px; font-weight: 600; color: #9A9A96;">מתכונים</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4B4B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <div style="font-size: 10px; font-weight: 600; color: #9A9A96;">צריכה</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4B4B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>
      <div style="font-size: 10px; font-weight: 600; color: #9A9A96;">עוד</div>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6E5C","options":["#0F6E5C","#4338CA","#0F766E","#B8862F"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0F6E5C' };
  }
}
</script>
</body>
</html>
